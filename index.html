<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missões Semanais</title>
<style>
:root{--bg:#0b1020;--panel:#151d32;--panel2:#1c2740;--text:#f5f7fb;--muted:#aab4ca;--accent:#7c5cff;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--border:#2b3857}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#080c18,#111a30);color:var(--text);min-height:100vh}
.container{max-width:1150px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}
h1{margin:0;font-size:30px}.subtitle{color:var(--muted);margin-top:5px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;color:white;background:var(--accent)}
button:hover{filter:brightness(1.1)}.btn-secondary{background:#293650}.btn-danger{background:#b91c1c}.btn-success{background:#15803d}
.stats{background:var(--panel);border:1px solid var(--border);padding:18px;border-radius:16px;margin-bottom:18px}
.progress-head{display:flex;justify-content:space-between;margin-bottom:10px}.progress{height:12px;background:#27334d;border-radius:20px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#7c5cff,#22c55e);width:0%;transition:.25s}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.controls button.active{background:#7c5cff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:15px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;position:relative;transition:.2s}
.card.done{border-color:#1f8f4d;opacity:.72}.card.done .title{text-decoration:line-through}
.card.important{box-shadow:0 0 0 1px rgba(239,68,68,.12)}
.row{display:flex;gap:12px;align-items:flex-start}.check{width:28px;height:28px;border-radius:8px;border:2px solid #64748b;background:transparent;display:grid;place-items:center;flex:none;font-size:16px;padding:0}.done .check{background:var(--green);border-color:var(--green)}
.title{font-size:18px;font-weight:800;line-height:1.25}.tag{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase}.important-tag{background:rgba(239,68,68,.15);color:#f87171}.low-tag{background:rgba(245,158,11,.14);color:#fbbf24}
.info{margin-top:14px;display:grid;gap:8px;color:#d7deed;font-size:14px}.label{color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:800}.actions{display:flex;gap:7px;margin-top:15px}.actions button{font-size:12px;padding:8px 10px}
.empty{padding:45px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--border);border-radius:16px;grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.modal-box{width:min(650px,100%);background:#121a2d;border:1px solid var(--border);border-radius:18px;padding:22px}
.form{display:grid;gap:12px}.form label{font-size:13px;color:var(--muted);font-weight:700}.form input,.form textarea,.form select{width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0d1425;color:white;font:inherit}.form textarea{min-height:100px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:5px}
@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}h1{font-size:25px}.container{padding:20px 12px}}
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <div><h1>🎯 Missões Semanais</h1><div class="subtitle">Controle de bosses, eventos e recompensas</div></div>
    <button onclick="openModal()">➕ Mais Missão</button>
  </div>

  <section class="stats">
    <div class="progress-head"><strong>Progresso da semana</strong><strong id="count">0 / 8</strong></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </section>

  <div class="controls">
    <button class="active" data-filter="all">Todas</button>
    <button class="btn-secondary" data-filter="pending">Pendentes</button>
    <button class="btn-secondary" data-filter="done">Concluídas</button>
    <button class="btn-secondary" data-filter="important">Importantes</button>
    <button class="btn-secondary" data-filter="low">Pouco importantes</button>
    <button class="btn-danger" onclick="resetWeek()">↻ Resetar semana</button>
  </div>

  <div class="grid" id="missions"></div>
</div>

<div class="modal" id="modal">
 <div class="modal-box">
  <h2 id="modalTitle">➕ Nova missão</h2>
  <form class="form" id="form">
   <input type="hidden" id="editId">
   <label>Local / Missão<input id="local" required></label>
   <label>Mundo<input id="world" placeholder="Ex.: Mundo 1"></label>
   <label>Boss / Evento<input id="boss"></label>
   <label>Como fazer<textarea id="how"></textarea></label>
   <label>Premiação<input id="reward"></label>
   <label>Prioridade<select id="priority"><option value="important">Importante</option><option value="low">Pouco importante</option></select></label>
   <div class="form-actions"><button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button><button type="submit">Salvar missão</button></div>
  </form>
 </div>
</div>

<script>
const initialMissions = [
 {id:1,local:"Compartimento Interno do Navio",world:"",boss:"Premiação / Evento de quinta-feira",how:"Como fazer o evento de quinta-feira",reward:"500 PO",priority:"low",done:false},
 {id:2,local:"Casa de Máquina",world:"",boss:"Premiação / Evento de quinta-feira",how:"Como fazer o evento de quinta-feira",reward:"500 Elixir",priority:"low",done:false},
 {id:3,local:"Floresta do Touro Malvado",world:"Mundo 1",boss:"Boss Matha",how:"Derrotar o Boss Matha",reward:"Moeda do Dragão",priority:"important",done:false},
 {id:4,local:"1F Templo do Touro",world:"Mundo 1",boss:"Boss Touro",how:"Derrotar o Boss Touro",reward:"Pedra Preta Raro",priority:"low",done:false},
 {id:5,local:"Santuário dos Touros",world:"Mundo 1",boss:"Boss Touro",how:"Derrotar o Boss Touro",reward:"Moeda do Dragão",priority:"important",done:false},
 {id:6,local:"Mundo do Vazio",world:"",boss:"Boss",how:"Derrotar o Boss",reward:"—",priority:"low",done:false},
 {id:7,local:"Parkua",world:"",boss:"Víbora",how:"Tesouro de Porco + matar Boss do Vale das Serpentes (Mundo 8) e Gruta (Mundo 8)",reward:"Pedra Roxa Lendária e Pedaço Épico",priority:"important",done:false},
 {id:8,local:"Parkua",world:"",boss:"Arahan",how:"Tesouro de Flor + matar Boss 1F, 2F, 3F e Mina",reward:"Pedra Roxa Lendária e Pedaço Épico",priority:"important",done:false}
];

let missions = JSON.parse(localStorage.getItem("weeklyMissions")) || initialMissions;
let currentFilter = "all";

function save(){localStorage.setItem("weeklyMissions",JSON.stringify(missions))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){
 const el=document.getElementById("missions");
 let list=missions.filter(m=>{
  if(currentFilter==="pending")return !m.done;
  if(currentFilter==="done")return m.done;
  if(currentFilter==="important")return m.priority==="important";
  if(currentFilter==="low")return m.priority==="low";
  return true;
 });
 el.innerHTML=list.length?list.map(m=>`
 <article class="card ${m.done?"done":""} ${m.priority==="important"?"important":""}">
  <div class="row">
   <button class="check" onclick="toggle(${m.id})">${m.done?"✓":""}</button>
   <div><div class="title">${esc(m.local)}</div><span class="tag ${m.priority==="important"?"important-tag":"low-tag"}">${m.priority==="important"?"IMPORTANTE":"POUCO IMPORTANTE"}</span></div>
  </div>
  <div class="info">
   ${m.world?`<div><span class="label">🌍 Mundo</span><br>${esc(m.world)}</div>`:""}
   <div><span class="label">👹 Boss / Evento</span><br>${esc(m.boss)}</div>
   ${m.how?`<div><span class="label">⚔️ Como fazer</span><br>${esc(m.how)}</div>`:""}
   <div><span class="label">🎁 Premiação</span><br>${esc(m.reward)}</div>
  </div>
  <div class="actions"><button class="btn-secondary" onclick="editMission(${m.id})">✏️ Editar</button><button class="btn-danger" onclick="deleteMission(${m.id})">🗑️ Excluir</button></div>
 </article>`).join(""):`<div class="empty">Nenhuma missão encontrada neste filtro.</div>`;
 updateProgress();
}
function updateProgress(){
 const done=missions.filter(m=>m.done).length,total=missions.length,pct=total?done/total*100:0;
 document.getElementById("count").textContent=`${done} / ${total}`;
 document.getElementById("bar").style.width=pct+"%";
}
function toggle(id){const m=missions.find(x=>x.id===id);m.done=!m.done;save();render()}
function deleteMission(id){if(confirm("Excluir esta missão?")){missions=missions.filter(m=>m.id!==id);save();render()}}
function resetWeek(){if(confirm("Desmarcar todas as missões?")){missions.forEach(m=>m.done=false);save();render()}}
function openModal(id=null){
 document.getElementById("modal").classList.add("open");
 document.getElementById("editId").value=id||"";
 document.getElementById("modalTitle").textContent=id?"✏️ Editar missão":"➕ Nova missão";
 if(id){let m=missions.find(x=>x.id===id);["local","world","boss","how","reward","priority"].forEach(k=>document.getElementById(k).value=m[k]||"")}
 else document.getElementById("form").reset();
}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function editMission(id){openModal(id)}
document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault();const id=Number(document.getElementById("editId").value);
 const data={local:local.value.trim(),world:world.value.trim(),boss:boss.value.trim(),how:how.value.trim(),reward:reward.value.trim()||"—",priority:priority.value};
 if(id){Object.assign(missions.find(m=>m.id===id),data)}else{missions.push({id:Date.now(),...data,done:false})}
 save();closeModal();render();
});
document.querySelectorAll("[data-filter]").forEach(btn=>btn.onclick=()=>{currentFilter=btn.dataset.filter;document.querySelectorAll("[data-filter]").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render()});
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
render();
</script>
</body>
</html>
